    - "A CLI atual (init, post, build, dev, serve, theme, deploy, clean) é a superfície completa; plugins são avançados"
    - "Filosofia 'quiet speed' do projeto deve ser respeitada: feedback claro sem poluir output"
    - "Recomendações devem ser acionáveis como tasks kata futuras, com escopo delimitado"
  alternatives:
    - "alt A: audit apenas por leitura de código — descartado: UX real só aparece executando a CLI em sandbox e observando output"
    - "alt B: survey com usuários reais — descartado: fora de escopo, sem acesso a usuários"
    - "alt C: executar jornada E2E real em sandbox + leitura de código — escolhido: evidência observável + contexto de implementação"
    - "alt D: comparar com Eleventy/Astro/Hugo onboarding — parcialmente: usar como referência de boas práticas, não audit completo"
  unknowns: "Como o init realmente se comporta hoje (arquivos gerados, mensagens); se post gera estrutura completa; se dev server dá next-steps ao primeiro usuário; o que o help text comunica vs o que falta"
