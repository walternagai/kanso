think:
  problem: "npm run coverage falha com 'c8: Exec format error' — os shims em node_modules/.bin/* foram criados como links IntxLNK (formato não-POSIX, provavelmente extraído de um pnpm/zip em Windows) em vez de shell wrappers padrão do npm. O eslint e tsc funcionam porque npm exec resolve de outra forma, mas c8 dentro de script npm invoca o shim direto. Diagnóstico confirmado: ln -s manual do ../c8/bin/c8.js faz coverage funcionar (90.62% linhas)."
  assumptions:
    - "A correção local (symlink) é temporária — node_modules é regenerado por npm install, que pode recriar o shim quebrado"
    - "Correção persistente: mudar o script coverage para usar node ./node_modules/c8/bin/c8.js em vez de depender do .bin (ou fixar npm config ignore-scripts / usar npx)"
  alternatives:
    - "alt A: trocar c8 por node --experimental-test-coverage — viável (Node 18+), removes dependência; coverage de linha apenas"
    - "alt B: script usa caminho direto do binário do c8 — escolhido: mínimo, mantém c8 e lcov"
    - "alt C: reinstalar node_modules — temporário, não resolve a causa (shim vem do ambiente)"
  unknowns: "Se o CI (GitHub Actions, CHANGELOG menciona) roda coverage — se sim, o fix do script é essencial lá também"
  answered: true
  skipped: false
