  problem: "Três melhorias estruturais de engine: (1) process.exit(1) espalhado em deploy.ts:42,55,74,108,122,134 e themes/index.ts:41,85,146 — funções de biblioteca terminam o processo, testes já precisam stubar (theme.error.test.ts:11-25), sintoma de design; (2) dev server descarta evento durante build (server.ts:94-95 if (isBuilding) return) — segunda mudança de arquivo pode não gerar rebuild; (3) collectMarkdownFiles re-varre e re-parseia coleção paginada inteira (build.ts:262-265) — parse de Markdown com highlight.js roda 2x"
  assumptions:
    - "classes DeployError/ThemeError com message suficiente; commands/ fazem catch → error() → exit(1)"
    - "mudar exit-handling é breaking para quem importa engine/ diretamente — projetod o repo sugere que só commands/ consomem"
    - "cache de parse é por-build (Map local), não global — invalidação desnecessária em processo único"
    - "needsRebuild: flag marcada no callback quando isBuilding, checada no finally para reagendar"
  alternatives:
    - "alt A: Result type (ok/err) em vez de exceptions — descartado: muda assinatura de toda a engine, custo alto para o ganho"
    - "alt B: fila de eventos pendentes (array) — descartado: flag booleana needsRebuild é suficiente para semântica de 'algo mudou'"
    - "alt C: cache global persistente de parse entre builds — descartado: especulativo, sem demanda; cache por build resolve o caso paginado"
